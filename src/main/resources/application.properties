spring.application.name=inventario-api

# Conexión a PostgreSQL (la del docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/inventario
spring.datasource.username=inventario_user
spring.datasource.password=${DB_PASSWORD:cambia_esto}

# Hibernate solo valida que las entidades coincidan con las tablas del script SQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false